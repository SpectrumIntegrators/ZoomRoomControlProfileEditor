<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" />
        <title>Zoom Room Control Profile Editor</title>
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css?family=Lato"
            rel="stylesheet" />
    </head>
    <body>
        <noscript>
            <strong>This application requires JavaScript to run. Please enable JavaScript and reload.</strong>
        </noscript>
        <div id="app"></div>

        <!-- ===== TEMPORARY domain-move banner — remove this whole block after the .com cutover ===== -->
        <style>
            @keyframes dm-pulse {
                0%, 100% { background-color: #c03221; }
                50% { background-color: #e8432e; }
            }
            #dm-banner {
                position: fixed;
                left: 0;
                right: 0;
                top: 60px; /* sits directly below the 60px app header (nav) */
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.6rem;
                flex-wrap: wrap;
                padding: 1.1rem 3.75rem 1.1rem 1.25rem;
                background: #c03221;
                color: #fff;
                font-family: 'Lato', sans-serif;
                font-size: 1.2rem;
                font-weight: 700;
                line-height: 1.4;
                text-align: center;
                letter-spacing: 0.2px;
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
                border-bottom: 3px solid rgba(0, 0, 0, 0.3);
                animation: dm-pulse 1.5s ease-in-out infinite;
            }
            #dm-banner .dm-icon {
                font-size: 1.5rem;
                line-height: 1;
            }
            #dm-banner a {
                color: #fff;
                text-decoration: underline;
                text-underline-offset: 3px;
                text-decoration-thickness: 2px;
                font-weight: 800;
                white-space: nowrap;
                padding: 0 0.15rem;
            }
            #dm-banner a:hover {
                background: rgba(255, 255, 255, 0.2);
            }
            #dm-banner-close {
                position: absolute;
                right: 1rem;
                top: 50%;
                transform: translateY(-50%);
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2rem;
                height: 2rem;
                padding: 0;
                background: rgba(0, 0, 0, 0.25);
                border: 2px solid rgba(255, 255, 255, 0.65);
                border-radius: 50%;
                color: #fff;
                font-size: 1.3rem;
                line-height: 1;
                cursor: pointer;
            }
            #dm-banner-close:hover {
                background: rgba(0, 0, 0, 0.5);
            }
        </style>
        <div id="dm-banner" role="alert">
            <span class="dm-icon" aria-hidden="true">&#9888;&#65039;</span>
            <span>
                Heads up! This tool is moving to
                <a href="https://zoom.spectrumintegrators.com">zoom.spectrumintegrators.com</a>
                on July&nbsp;1,&nbsp;2026 &mdash; update your bookmarks now!
            </span>
            <button id="dm-banner-close" type="button" aria-label="Dismiss">&times;</button>
        </div>
        <script>
            (function () {
                var KEY = 'dm-banner-dismissed';
                var banner = document.getElementById('dm-banner');
                function hide() {
                    // Inline style beats the #dm-banner { display: flex } rule,
                    // unlike the [hidden] attribute which it would override.
                    banner.style.display = 'none';
                }
                try {
                    // sessionStorage: dismissal survives reloads but is cleared
                    // when the tab closes, so the banner returns on a fresh visit.
                    if (sessionStorage.getItem(KEY) === '1') {
                        hide();
                        return;
                    }
                } catch (e) {
                    /* sessionStorage blocked — just show the banner */
                }
                document.getElementById('dm-banner-close').addEventListener('click', function () {
                    hide();
                    try {
                        sessionStorage.setItem(KEY, '1');
                    } catch (e) {
                        /* ignore */
                    }
                });
            })();
        </script>
        <!-- ===== end domain-move banner ===== -->

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
