<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" />
        <title>Zoom Room Control Profile Editor</title>
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css?family=Lato"
            rel="stylesheet" />
    </head>
    <body>
        <noscript>
            <strong>This application requires JavaScript to run. Please enable JavaScript and reload.</strong>
        </noscript>
        <div id="app"></div>

        <!-- ===== TEMPORARY domain-move banner — remove this whole block after the .com cutover ===== -->
        <style>
            #dm-banner {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.75rem;
                flex-wrap: wrap;
                padding: 0.7rem 3rem 0.7rem 1rem;
                background: #462444;
                color: #fff;
                font-family: 'Lato', sans-serif;
                font-size: 0.9rem;
                line-height: 1.4;
                text-align: center;
                box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.25);
            }
            #dm-banner a {
                color: #fff;
                text-decoration: underline;
                text-underline-offset: 2px;
                font-weight: 700;
                white-space: nowrap;
            }
            #dm-banner-close {
                position: absolute;
                right: 0.75rem;
                top: 50%;
                transform: translateY(-50%);
                background: transparent;
                border: 0;
                color: #fff;
                font-size: 1.4rem;
                line-height: 1;
                cursor: pointer;
                padding: 0.25rem 0.5rem;
                opacity: 0.8;
            }
            #dm-banner-close:hover {
                opacity: 1;
            }
        </style>
        <div id="dm-banner" role="status" hidden>
            <span>
                This tool is moving to
                <a href="https://zoom.spectrumintegrators.com">zoom.spectrumintegrators.com</a>
                on <strong>July&nbsp;1,&nbsp;2026</strong>. Please update your bookmarks.
            </span>
            <button id="dm-banner-close" type="button" aria-label="Dismiss">&times;</button>
        </div>
        <script>
            (function () {
                var KEY = 'dm-banner-dismissed';
                var banner = document.getElementById('dm-banner');
                try {
                    if (localStorage.getItem(KEY) === '1') return;
                } catch (e) {
                    /* localStorage blocked — just show the banner */
                }
                banner.hidden = false;
                document.getElementById('dm-banner-close').addEventListener('click', function () {
                    banner.hidden = true;
                    try {
                        localStorage.setItem(KEY, '1');
                    } catch (e) {
                        /* ignore */
                    }
                });
            })();
        </script>
        <!-- ===== end domain-move banner ===== -->

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
